<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Bluestem Real Estate and Land</title>
  <meta name="description" content="Get in touch with Danny Bullock at Bluestem Real Estate and Land. Residential, land & ranch, and commercial real estate across southcentral Kansas.">
  <link rel="canonical" href="https://bluestemreal.com/contact/">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:title" content="Contact Us | Bluestem Real Estate and Land">
  <meta property="og:description" content="Get in touch with Danny Bullock. Residential, land & ranch, and commercial real estate across southcentral Kansas.">
  <meta property="og:url" content="https://bluestemreal.com/contact/">
  <meta property="og:type" content="website">
  <!-- HEAD -->
</head>
<body>
  <!-- HEADER -->

  <div class="kg-breadcrumb">
    <div class="container">
      <a href="/">Home</a><span>/</span>Contact
    </div>
  </div>

  <section class="kg-page-header">
    <div class="container">
      <h1>Get In Touch</h1>
      <p>Tell us what you&rsquo;re looking for &mdash; home, land, or commercial property &mdash; and Danny will respond directly.</p>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="kg-two-col">
        <div class="gsap-fade-left">
          <h2>Send a Message</h2>
          <div class="kg-form-tabs" style="margin-top:20px;">
            <button type="button" class="kg-form-tab active" data-target="residential">Residential</button>
            <button type="button" class="kg-form-tab" data-target="land">Land &amp; Ranch</button>
            <button type="button" class="kg-form-tab" data-target="commercial">Commercial</button>
          </div>
          <form class="kg-form" action="/submit" method="POST" style="margin-top:20px;">
            <input type="hidden" name="inquiryType" value="residential">
            <div class="kg-form-row">
              <div class="kg-form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
              </div>
              <div class="kg-form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone">
              </div>
            </div>
            <div class="kg-form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required>
            </div>
            <div class="kg-form-group">
              <label for="message">What are you looking for?</label>
              <textarea id="message" name="message" rows="5" placeholder="Tell us about the property you're buying, selling, or interested in."></textarea>
            </div>
            <script src="https://www.google.com/recaptcha/enterprise.js?render=RECAPTCHA_SITE_KEY" async defer></script>
            <button type="submit" class="btn btn-primary">Send Message</button>
          </form>
        </div>
        <div class="gsap-fade-right">
          <div class="kg-agent-card">
            <h3>Contact Info</h3>
            <ul class="kg-footer-contact" style="margin-top:16px;color:var(--kg-text);">
              <li style="display:flex;gap:10px;margin-bottom:14px;">
                <span>&#128205;</span>
                <span>Serving Southcentral Kansas</span>
              </li>
              <li style="display:flex;gap:10px;margin-bottom:14px;">
                <span>&#128222;</span>
                <a href="tel:3162139678" style="color:var(--kg-primary);">(316) 213-9678</a>
              </li>
              <li style="display:flex;gap:10px;">
                <span>&#9993;</span>
                <a href="mailto:danny@bluestemreal.com" style="color:var(--kg-primary);">danny@bluestemreal.com</a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
</body>
</html>
